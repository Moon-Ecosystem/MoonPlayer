name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the APK'
        required: true
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.0). Required if not triggered by a Git tag.'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release Title (optional)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare build environment
        run: |
          # Ensure gradlew has execute permissions
          chmod +x gradlew

          # Prepare .env configuration file from template if not present
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          else
            touch .env
          fi

      # Release signing reads KEYSTORE_PATH / STORE_PASSWORD / KEY_PASSWORD (key alias "upload").
      # A fixed key keeps every release installable over the previous one.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (base64 of the upload keystore)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Every push to main is a new numbered pre-release: Moon Player Alpha 1, 2, 3...
      # N follows the highest alpha-N tag, so deleting old releases doesn't reuse numbers
      # unless their tags go too.
      - name: Pick alpha number
        id: alpha
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          LAST=$(git tag -l 'alpha-*' | sed 's/^alpha-//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          N=$(( ${LAST:-0} + 1 ))
          echo "number=$N" >> "$GITHUB_OUTPUT"
          echo "Building Moon Player Alpha $N"

      - name: Build Android APK
        run: |
          # The app shows the alpha as its version name; versionCode comes from the commit count.
          if [ -n "${{ steps.alpha.outputs.number }}" ]; then
            VERSION_ARGS="-PappVersionName=alpha-${{ steps.alpha.outputs.number }}"
          fi
          ./gradlew assembleRelease --stacktrace $VERSION_ARGS
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release artifacts & checksums
        id: prepare_artifacts
        run: |
          mkdir -p release-output

          # Determine version name or tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG_NAME="${{ inputs.release_tag }}"
          elif [ -n "${{ steps.alpha.outputs.number }}" ]; then
            TAG_NAME="alpha-${{ steps.alpha.outputs.number }}"
          else
            TAG_NAME="v1.0.0-build${{ github.run_number }}"
          fi

          echo "artifact_version=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_DEST="release-output/MoonPlayer-${TAG_NAME}.apk"

          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "$APK_DEST"
            echo "Copied APK to $APK_DEST"
            
            # Generate SHA256 checksum for verification
            cd release-output
            sha256sum "MoonPlayer-${TAG_NAME}.apk" > checksums-sha256.txt
            cd ..
          else
            echo "ERROR: APK not found at $APK_SRC"
            exit 1
          fi

      - name: Upload APK artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: moon-player-apk-${{ steps.prepare_artifacts.outputs.artifact_version }}
          path: release-output/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.artifact_version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_title != '' && inputs.release_title || (steps.alpha.outputs.number != '' && format('Moon Player Alpha {0}', steps.alpha.outputs.number)) || steps.prepare_artifacts.outputs.artifact_version }}
          files: release-output/*
          draft: false
          # Alpha builds from main are pre-releases; only v* tags (or a manual run) publish a full release.
          prerelease: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### 🌙 Moon Player APK Release

            **Artifacts:**
            - `MoonPlayer-${{ steps.prepare_artifacts.outputs.artifact_version }}.apk`: Ready-to-install Android Application Package.
            - `checksums-sha256.txt`: SHA-256 integrity checksums.

            *Automated build by GitHub Actions.*

            Each push to `main` publishes a new numbered alpha pre-release; it installs over the previous one.
